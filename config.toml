[server]
port = 8300
# Keep 127.0.0.1. Phones reach Scranton through Tailscale Serve, not an open port.
host = "127.0.0.1"
# Add your Tailscale Serve address here for phone access, e.g.
# allowed_origins = ["https://mac-mini.tail1234.ts.net"]
allowed_origins = []
data_dir = "./data"

# Scranton team. Each teammate is one CLI you're already logged into with
# your subscription: "claude" (Claude plan), "codex" (ChatGPT plan, also for
# the GPT roles), "agent" (Cursor plan). The block name is the @handle.
#
#   role      one line added to every wake-up ("ROLE: ...")
#   cwd       folder the agent works in (~ allowed; relative paths are relative to this repo).
#             A folder listed under [team.projects] is cloned from GitHub the first time it's needed.
#   autostart false = listed here but not started by ./scranton.sh start
#             (start it by hand: ./scranton.sh start growth)
#
# From "Buzz 设定整理" and BUZZ_HANDOVER.md (2026-11-07). role_card files in
# roles/ are the original harness role cards, unmodified. Things marked 待确认
# were open in those notes too; nothing was filled in by guessing.

[team]
owner = "Lu"          # your name in the chat; agents @Lu you
# "full": teammates never stop to ask for permission (Claude: bypassPermissions,
# Codex: no approvals and no sandbox, Cursor: --force). Deny rules in a project's
# .claude/settings.json still apply to Claude. "ask": the CLIs' normal prompts.
# Override per teammate with  permissions = "ask"  in its block.
permissions = "full"
# Commits: every teammate commits with the bot account's email (GitHub shows the bot,
# you merge), named after the teammate. Put the bot's email in config.local.toml:
#   [team]
#   git_email = "<the bot account's email>"
git_email = ""
# Where harness-core is checked out on this Mac (its scripts/gh-push.sh queues every GitHub write)
harness_core = "~/.buzz/REPOS/harness-core"
channels = ["lu-portfolio", "scranton-feedback"]

brief = "Address Lu as Lu. Whenever you need Lu (a decision, a design to pick, a design PR to merge, a blocker only she can clear, or a delivery she asked for), write @Lu in that message so it reaches her Activity; don't @Lu for anything else. Hand work to a teammate by @handle, otherwise nobody wakes up: @pm project manager, @harness harness manager, @dev developer, @qa code review & QA, @visual visual designer, @visualqa visual QA, @motion motion designer, @research UX researcher, @copy UX writer, @help Scranton helper, @ops release & ops (deploy checks, plan usage), @legal legal & privacy, @data data analyst, @growth growth, @cs customer support, @video video editor. Report in the channel in concise Chinese, one line: what was done | PR link | what remains | blockers. Lu makes the final calls and does not read code. Merging: code PRs are merged by Code Review & QA with scripts/merge-pr.sh after review, without asking Lu; PRs labelled design go to Lu after Visual QA gives its verdict, and only Lu merges them (never run gh pr merge yourself). High-risk actions (deploying, sending anything outside, paid calls, changing real data, deleting what can't be recovered) follow harness-core docs/approval.md: a reply of 好 in chat is not approval; Lu approves the 执行 PR on GitHub. Scranton replaces Buzz: post with the chat tools (chat_send, attach screenshots with image_path), channels are names like lu-portfolio, and ignore instructions about buzz messages send or BUZZ_* variables. harness-core is at {harness_core}. GitHub: all teammates share one bot account, so every GitHub write (push, PR, comment, label, merge-pr.sh) goes through {harness_core}/scripts/gh-push.sh as docs/github-usage.md says; push once when a piece of work is done, never poll; on 403, 429, rate limit, suspended or abuse stop at once, do not retry, and tell @Lu. Code-changing teammates each have their own git worktree: work on your own branch there, never in another teammate's folder. Plan limits: if your app says you've hit a usage limit, stop, say so once in the channel with @Lu, and don't retry until she answers. Stuck teammates: the project manager lists anyone who didn't answer or is waiting on a question in the daily summary. Priorities across projects: Lu sets the order once a week; the project manager plans by it and asks @Lu only when two projects need the same teammate at the same time."




# Project folders and where to get them. If a teammate's folder is missing, Scranton
# clones it once (with this Mac's own GitHub login) before starting them.
[team.projects]
"~/LuJin-Portfolio" = "https://github.com/lujin88/LuJin-Portfolio.git"
"~/.buzz/REPOS/harness-core" = "https://github.com/lujin88/harness-core.git"

# Who is in each channel. Used the first time Scranton sees the channel; after that,
# add or remove people in the channel's member list (they're started automatically).
# @-mentioning a teammate in a channel also adds them.
[team.members]
lu-portfolio = ["pm", "harness", "dev", "qa", "visual", "visualqa", "motion", "research", "copy"]
scranton-feedback = ["help"]

# Recurring posts made by Scranton itself (no teammate has to stay awake for them).
# Created once; delete one in the UI and it stays deleted. Times are this Mac's local time.
[[team.schedules]]
id = "daily-backup"
daily_at = "21:00"
to = ["pm"]
channel = "lu-portfolio"
text = "每日备份和每日总结：按 harness-core AGENTS.md「每日备份」做（GitHub backup 分支 + Obsidian 日志，跑 daily-backup.sh check 把表贴出来），做完在这里 @Lu 一行总结。"

