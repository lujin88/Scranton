[server]
port = 8300
# Keep 127.0.0.1. Phones reach Scranton through Tailscale Serve, not an open port.
host = "127.0.0.1"
# Add your Tailscale Serve address here for phone access, e.g.
# allowed_origins = ["https://mac-mini.tail1234.ts.net"]
allowed_origins = []
data_dir = "./data"

# Scranton team. Each entry is one CLI you already pay for and are logged into.
# "cwd" is the folder the agent works in (relative to this repo, or absolute).
# Add more teammates by copying a block and giving it a new name, e.g.
# [agents.designer] with command = "claude".

[agents.claude]
command = "claude"
cwd = ".."
color = "#d97757"
label = "Claude"

[agents.codex]
command = "codex"
cwd = ".."
color = "#10a37f"
label = "Codex"

# Cursor CLI ("agent", older installs call it "cursor-agent").
# Cursor reads MCP servers from .cursor/mcp.json in its working folder.
[agents.cursor]
command = "agent"
cwd = ".."
color = "#5b6cff"
label = "Cursor"
mcp_inject = "settings_file"
mcp_settings_path = ".cursor/mcp.json"
mcp_transport = "http"
mcp_http_key = "url"

[routing]
# "none" = only route on explicit @mention. "all" = route to all agents by default.
default = "none"
max_agent_hops = 4

[mcp]
http_port = 8200
sse_port = 8201

[images]
upload_dir = "./uploads"
max_size_mb = 10

[attachments]
# Non-image files share images.upload_dir; agents must be able to read that folder.
max_size_mb = 25
# Accept any file type, including files without an extension. To restrict types,
# replace ["*"] with a list such as [".pdf", ".txt", ".py", ".wav"].
allowed_extensions = ["*"]

# --- MCP injection modes ---
# By default, claude/codex/gemini/kimi use built-in MCP config injection.
# For other CLI agents, set mcp_inject to tell the wrapper how to inject auth:
#
# mcp_inject modes:
#   "settings_file" — write a JSON settings file at mcp_settings_path (merges, not overwrites)
#   "env"           — write a settings file, expose path via mcp_env_var
#   "flag"          — write a config file, pass via CLI flag (mcp_flag, default: --mcp-config)
#   "proxy_flag"    — start a local proxy, pass URL via CLI flag template
#
# Example: Qwen Code CLI
#   [agents.qwen]
#   command = "qwen"
#   cwd = ".."
#   color = "#8b5cf6"
#   label = "Qwen"
#   mcp_inject = "settings_file"
#   mcp_settings_path = ".qwen/settings.json"
#   mcp_transport = "http"
#
# Example: CLI with env var for settings
#   [agents.mycli]
#   command = "mycli"
#   mcp_inject = "env"
#   mcp_env_var = "MYCLI_MCP_SETTINGS"
#   mcp_transport = "http"
