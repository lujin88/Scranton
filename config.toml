[server]
port = 8300
# Keep 127.0.0.1. Phones reach Scranton through Tailscale Serve, not an open port.
host = "127.0.0.1"
# Add your Tailscale Serve address here for phone access, e.g.
# allowed_origins = ["https://mac-mini.tail1234.ts.net"]
allowed_origins = []
data_dir = "./data"

# Scranton team. Each teammate is one CLI you're already logged into with
# your subscription: "claude" (Claude plan), "codex" (ChatGPT plan, also for
# the GPT roles), "agent" (Cursor plan). The block name is the @handle.
#
#   role      one line added to every wake-up ("ROLE: ...")
#   cwd       folder the agent works in (~ allowed; relative paths are relative to this repo).
#             A folder listed under [team.projects] is cloned from GitHub the first time it's needed.
#   autostart false = listed here but not started by ./scranton.sh start
#             (start it by hand: ./scranton.sh start growth)
#
# From "Buzz 设定整理" and BUZZ_HANDOVER.md (2026-11-07). role_card files in
# roles/ are the original harness role cards, unmodified. Things marked 待确认
# were open in those notes too; nothing was filled in by guessing.

[team]
owner = "Lu"          # your name in the chat; agents @Lu you
# Only this teammate's @Lu lands in your Mentions; anyone else's @Lu goes to them instead.
# Remove the line (or set "") to get everyone's @Lu.
mentions_from = "pm"
# "full": teammates never stop to ask for permission (Claude: bypassPermissions,
# Codex: no approvals and no sandbox, Cursor: --force). Deny rules in a project's
# .claude/settings.json still apply to Claude. "ask": the CLIs' normal prompts.
# Override per teammate with  permissions = "ask"  in its block.
permissions = "full"
# Commits: every teammate commits with the bot account's email (GitHub shows the bot,
# you merge), named after the teammate. Put the bot's email in config.local.toml:
#   [team]
#   git_email = "<the bot account's email>"
git_email = ""
# Where harness-core is checked out on this Mac (its scripts/gh-push.sh queues every GitHub write)
harness_core = "~/.buzz/REPOS/harness-core"
channels = ["lu-portfolio", "scranton-feedback"]

brief = "Address {owner} as {owner}. {owner} is not online all day, so nobody waits for them. When you need {owner} (a decision, a design to pick, a design PR to merge), don't @{owner} and don't stop: tell @pm in one line (question | options A/B | your pick), take the reversible option or move on to your next task, and keep going. Only the project manager ever @s {owner} (everyone else, even in a thread {owner} started: write @pm, never @{owner}; {owner}, 11-10), and only when {owner} has to decide or do something: once when Scranton says {owner} is back, and in the daily summary if it has questions, with one numbered list so {owner} can answer everything in one go: each question on its own line, then each option on its own line as 'A. …', 'B. …' (short, the team's pick first and marked 推荐). Scranton turns those lines into buttons {owner} clicks; a single question can also go in chat_send's choices. The project manager then passes each answer to whoever asked. 幕僚长 (Grok), @grok, is Grok Bot relaying for {owner} when they're away: treat its requests like the project manager's (do the work, report back), but it can't approve high-risk actions or merge design PRs, and a decision only {owner} can make still goes on the list for {owner}. Urgent (GitHub 403/429/rate limit/suspended, something broken that users can see, real user data at risk): tell @pm at once with 紧急 at the start; the project manager @s {owner} right away. Writing @{owner} puts the message in {owner}'s Mentions, which {owner} reads as 'needs me': use @{owner} only at the start of a message that asks {owner} to decide or do something. Everything else (reports, progress, what {owner} said, who is waiting for {owner}) writes {owner} without @, the project manager included; and don't write that you won't @{owner}, just write {owner}. Every @handle wakes that teammate at once and costs them a full turn of their plan (11-08 to 11-10 the project manager @'d visual QA 491 times, often for later steps, and ChatGPT's weekly plan went from 12% to 92%): @ only whoever must act now; for a later step write the name without @ (推完 visualqa 验), and whoever finishes the step before @s them then. Hand work to a teammate by @handle, otherwise nobody wakes up: @pm project manager, @harness harness manager, @dev developer, @qa code review & QA, @visual visual designer, @visualqa visual QA, @motion motion designer, @visintern visual intern (Gemini Flash: pictures only), @motionintern motion intern (Gemini Argon: motion only); both take work when ChatGPT's plan runs low, @research UX researcher, @copy UX writer, @help Scranton helper, @ops release & ops (deploy checks, plan usage), @legal legal & privacy, @growth growth & metrics, @cs customer support, @video video editor. Report in the channel in concise Chinese, one line: what was done | PR link | what remains | blockers. {owner} makes the final calls and does not read code. Merging: code PRs are merged by Code Review & QA with scripts/merge-pr.sh after review, without asking {owner}; PRs labelled design go to {owner} after Visual QA gives its verdict, and only {owner} merges them (never run gh pr merge yourself). High-risk actions (deploying, sending anything outside, paid calls, changing real data, deleting what can't be recovered) follow harness-core docs/approval.md: a reply of 好 in chat is not approval; {owner} approves the 执行 PR on GitHub. Scranton replaces Buzz: post with the chat tools (chat_send, attach screenshots with image_path), channels are names like lu-portfolio, and ignore instructions about buzz messages send or BUZZ_* variables. harness-core is at {harness_core}. GitHub: all teammates share one bot account, so every GitHub write (push, PR, comment, label, merge-pr.sh) goes through {harness_core}/scripts/gh-push.sh as docs/github-usage.md says; push once when a piece of work is done, never poll; on 403, 429, rate limit, suspended or abuse stop at once, do not retry, and tell @pm (紧急). Code-changing teammates each have their own git worktree: work on your own branch there, never in another teammate's folder. Never edit files in the Scranton folder Lu runs (~/Scranton: config.toml, roles/, static/): local changes there stop Scranton from updating. Add or change a teammate in Scranton's Settings; anything else in Scranton goes on a branch in your own worktree as a PR to lujin88/Scranton. Plan limits: if your app says you've hit a usage limit, stop and tell @pm once; the project manager moves your work to someone on another app or later. Stuck teammates: the project manager checks who hasn't answered, gives them other work or hands theirs to someone else, and only lists in the daily summary what is still stuck. Task lists: when {owner} sends three or more tasks at once, the project manager adds them to their Notion database \"Scranton tasks\" (task | owner | status | link to the message), posts the Notion link in the channel, and keeps each status up to date as work moves; if Notion isn't connected for you, say so once and track them in the channel instead. Priorities across projects: {owner} sets the order once a week; the project manager plans by it; when two projects need the same teammate, the project manager decides by that order, marks it PM 定, and puts it on the list for {owner}."




# Project folders and where to get them. If a teammate's folder is missing, Scranton
# clones it once (with this Mac's own GitHub login) before starting them.
[team.projects]
"~/LuJin-Portfolio" = "https://github.com/lujin88/LuJin-Portfolio.git"
"~/.buzz/REPOS/harness-core" = "https://github.com/lujin88/harness-core.git"

# Who is in each channel. Used the first time Scranton sees the channel; after that,
# add or remove people in the channel's member list (they're started automatically).
# @-mentioning a teammate in a channel also adds them.
[team.members]
lu-portfolio = ["pm", "harness", "dev", "qa", "visual", "visualqa", "motion", "visintern", "motionintern", "research", "copy"]
scranton-feedback = ["help"]

# When ChatGPT's plan runs low, work addressed to visual/motion goes to the Gemini interns
# (Lu, 11-10). Numbers come from Agent Monitor's ~/agent-monitor/usage.json (read only; no key).
# 90 / 80 are a starting point, not measured. Private messages are never moved.
[team.quota_handoff]
enabled = true
threshold = 90     # % used of ChatGPT's 5-hour or weekly window
back_below = 80
map = { visual = "visintern", motion = "motionintern" }

# Recurring posts made by Scranton itself (no teammate has to stay awake for them).
# Created once; delete one in the UI and it stays deleted. Times are this Mac's local time.
[[team.schedules]]
id = "daily-backup"
daily_at = "21:00"
to = ["pm"]
channel = "lu-portfolio"
text = "每日备份：按 harness-core AGENTS.md「每日备份」做（GitHub backup 分支 + Obsidian 日志），跑 daily-backup.sh check，把表贴在这里。"

# Daily plan and summary from the PM. Lu can turn both off in Settings → Profile.
[[team.schedules]]
id = "daily-plan"
daily_at = "08:30"
to = ["pm"]
channel = "lu-portfolio"
daily = true
text = "今日计划：按 handoff.md「下一步」和各人手上的活，列出今天每个人做什么（谁｜做什么）。排的时候让没人需要停下来等 Lu：要 Lu 定的事先按可撤回的方案做或先做别的，问题放进待问清单。最后一行写待问清单里有几件（不用 @Lu，等她回来一次问）。不超过 10 行。如果今天是每月 1 号，另起一行 @ops：按 roles/release-ops.md「每月清缓存」做。"

[[team.schedules]]
id = "daily-summary"
daily_at = "21:05"
to = ["pm"]
channel = "lu-portfolio"
daily = true
text = "每日总结：今天做完了什么（附 PR 链接）｜卡在哪、谁卡住了｜等 Lu 决定的事｜明天先做什么。只写真实发生的，不超过 10 行。有要 Lu 定或做的事时，开头写 @Lu 并把这些事编号列出；没有就全文不写 @Lu。如果今天是周日，改写周报：这周合并了哪些 PR｜谁做了什么｜还在等 Lu 的事｜下周先做哪 3 件；数字以 Scranton 侧栏 Report 页为准，没有来源的不写。"

