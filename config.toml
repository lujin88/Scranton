command = "agent"
cwd = "../LuJin-Portfolio"
color = "#7dc4e4"
role = "网页开发：网页开发"
autostart = false
mcp_inject = "settings_file"
mcp_settings_path = ".cursor/mcp.json"
mcp_transport = "http"
mcp_http_key = "url"

[agents.video]
label = "视频制作"
command = "claude"
cwd = ".."
color = "#939ab7"
role = "视频制作：视频"
avatar = "video-rabbit.jpg"
